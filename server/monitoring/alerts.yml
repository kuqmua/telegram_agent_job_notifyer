groups:
  - name: telegram_agent_queue
    rules:
      - alert: TelegramAgentTaskQueueStuck
        expr: min_over_time(task_queue_depth[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Telegram agent queue is not draining"
          description: "task_queue_depth stayed above zero for at least 15 minutes."
