[package]
name = "cdx_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Codex wrapper CLI"
repository = "https://github.com/user/repo"
readme = "../README.md"
keywords = ["cli"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[package.metadata.deb]
name = "cdx-cli"
maintainer = "Sergey <sergey@example.com>"
copyright = "2026, Sergey"
license-file = ["../LICENSE", "4"]
extended-description = """CLI wrapper for Codex CLI with sequential iterations.
Requires Codex CLI binary available in PATH as `codex` or via CODEX_BIN."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
  ["target/release/cdx_cli", "usr/bin/cdx-cli", "755"],
  ["../README.md", "usr/share/doc/cdx-cli/README.md", "644"],
  ["../LICENSE", "usr/share/doc/cdx-cli/LICENSE", "644"],
]
